<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三種手寫字體比較 · Dan 的生日卡片</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    @font-face { font-family: 'Birthday Preview A'; src: url('./assets/font-preview/wenkai.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Birthday Preview B'; src: url('./assets/font-preview/iansui.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Birthday Preview C'; src: url('./assets/font-preview/chenyu.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Birthday Preview D'; src: url('./assets/fonts/letter-handwriting.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Birthday Preview E'; src: url('./assets/font-preview/jason9.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    body { background: #f4f1eb; }
    .preview-page { display: block; place-items: normal; max-width: 1246px; margin: auto; padding: 36px 32px 48px; }
    .preview-heading { margin: 0 0 10px; font-size: 28px; font-weight: 600; }
    .preview-intro { margin: 0; color: #756d78; font-size: 14px; line-height: 1.7; }
    .preview-status { min-height: 24px; margin: 8px 0 24px; color: #756d78; font-size: 13px; }
    .preview-nav { display: flex; flex-wrap: wrap; gap: 12px 24px; margin: 16px 0; font-size: 14px; }
    .preview-nav a { color: #756d78; text-underline-offset: 5px; }
    .preview-nav a[aria-current="page"] { color: #3a3044; font-weight: 600; }
    .preview-grid { display: grid; width: 100%; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; align-items: start; }
    .preview-option { min-width: 0; }
    .preview-label { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
    .preview-description { margin: 0; color: #756d78; font-size: 13px; line-height: 1.6; }
    .preview-sample { font-family: var(--preview-font), serif; font-size: 20px; font-weight: 400; line-height: 1.6; margin: 16px 0 22px; white-space: pre-line; min-height: 64px; }
    .preview-option .card { width: 100%; }
    .preview-option .letter-message { font-family: var(--preview-font), serif; }
    .preview-source { display: inline-block; margin-top: 16px; color: #756d78; font-size: 12px; text-underline-offset: 3px; }
    @media (max-width: 980px) {
      .preview-page { padding: 28px 12px; }
      .preview-grid { grid-template-columns: minmax(0, 378px); justify-content: center; gap: 40px; }
      .preview-heading, .preview-intro, .preview-status { max-width: 378px; margin-left: auto; margin-right: auto; }
    }
  </style>
</head>
<body>
  <main class="preview-page">
    <h1 class="preview-heading">三種手寫字體，放進同一張卡片</h1>
    <p class="preview-intro">上方放大看筆畫，下方看實際閱讀效果。三版使用相同字級、行距與版面，標題維持原字體。</p>
    <nav class="preview-nav" aria-label="字體比較組別">
      <a href="?set=natural" data-set="natural">C・D・E：手寫感與可讀性</a>
      <a href="?set=original" data-set="original">A・B・C：原本三款</a>
    </nav>
    <p class="preview-status" role="status">正在載入三種字體…</p>
    <div class="preview-grid"></div>
  </main>
  <script type="module">
    import { cardContent } from './card-content.js';
    import { createBackground } from './components/background.js';
    import { createTitle } from './components/title.js';
    import { createLetter } from './components/letter.js';
    import { createAlbum } from './components/album.js';
    import { createCharacter } from './components/character.js';
    import { createDecorations } from './components/decorations.js';

    const allOptions = [
      { id: 'A', name: '霞鶩文楷 TC', description: '工整、溫柔，長段落比較容易讀。', source: 'https://github.com/lxgw/LxgwWenkaiTC' },
      { id: 'B', name: '芫荽', description: '筆觸自然，像認真寫下的一封信。', source: 'https://github.com/ButTaiwan/iansui' },
      { id: 'C', name: '辰宇落雁體', description: '纖細、隨性，手寫感最明顯。', source: 'https://github.com/Chenyu-otf/chenyuluoyan_thin' },
      { id: 'D', name: '清松手寫體 2', description: '保留原子筆書寫感，字形比 C 端正。', source: 'https://github.com/max32002/JasonHandWritingFonts' },
      { id: 'E', name: '清松手寫體 9', description: '自然、有個性，筆畫比 C 更容易辨識。', source: 'https://github.com/jasonhandwriting/JasonHandwriting' },
    ];
    const group = new URLSearchParams(location.search).get('set') === 'original' ? 'original' : 'natural';
    const options = group === 'original' ? allOptions.slice(0, 3) : allOptions.slice(2);
    document.querySelector(`[data-set="${group}"]`).setAttribute('aria-current', 'page');
    if (group === 'natural') document.querySelector('.preview-heading').textContent = '保留手寫感，再清楚一點';

    for (const option of options) {
      const section = document.createElement('section');
      section.className = 'preview-option';
      section.style.setProperty('--preview-font', `'Birthday Preview ${option.id}'`);
      section.innerHTML = `<h2 class="preview-label">${option.id} · ${option.name}</h2>
        <p class="preview-description">${option.description}</p>
        <p class="preview-sample">你是我心中的大墩第一名。\n27 歲生日快樂！</p>`;
      const card = document.createElement('article');
      card.className = 'card';
      card.setAttribute('aria-label', `${option.name}卡片預覽`);
      card.append(
        createBackground(cardContent.background), createTitle(cardContent.title),
        createLetter(cardContent.letter, cardContent.letterSticker), createAlbum(cardContent.photos, cardContent.albumBackground),
        createCharacter(cardContent.character), createDecorations(),
      );
      const source = document.createElement('a');
      source.className = 'preview-source';
      source.href = option.source;
      source.textContent = '字體作者與來源 ↗';
      section.append(card, source);
      document.querySelector('.preview-grid').append(section);
    }

    try {
      await Promise.all(options.map(option => document.fonts.load(`16px "Birthday Preview ${option.id}"`)));
      document.querySelector('.preview-status').textContent = '三種字體已載入，可以直接比較。';
    } catch {
      document.querySelector('.preview-status').textContent = '字體尚未載入成功，請重新整理後再比較。';
    }
  </script>
</body>
</html>
